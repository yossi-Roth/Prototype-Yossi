<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עיין לפי תחום — קטלוג מדדים חברתיים | JDC DIDA</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ul, ol { list-style: none; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    a { color: inherit; text-decoration: none; }

    /* ─── DESIGN TOKENS ─── */
    :root {
      --primary:        #334155;
      --primary-hover:  #1E293B;
      --primary-light:  #F1F5F9;
      --primary-border: #CBD5E1;

      --surface:    #FFFFFF;
      --surface-2:  #F8FAFC;
      --surface-3:  #F1F5F9;
      --border:     #E2E8F0;
      --border-strong: #CBD5E1;

      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-tertiary:  #94A3B8;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);

      /* Type badge colors — wireframe grays */
      --outcome-bg:     #F1F5F9; --outcome-text: #1E293B; --outcome-border: #CBD5E1;
      --output-bg:      #F8FAFC; --output-text:  #334155; --output-border:  #CBD5E1;
      --impact-bg:      #1E293B; --impact-text:  #FFFFFF; --impact-border:  #1E293B;
      --input-bg:       #FFFFFF; --input-text:   #64748B; --input-border:   #94A3B8;
    }

    /* ─── BASE ─── */
    body {
      font-family: 'Heebo', sans-serif;
      background: var(--surface-2);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── GLOBAL NAV ─── */
    .global-nav {
      position: sticky;
      inset-block-start: 0;
      z-index: 100;
      background: var(--surface);
      border-block-end: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .global-nav-inner {
      max-width: 1280px;
      margin-inline: auto;
      padding-inline: 32px;
      padding-block: 14px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .nav-logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      flex-shrink: 0;
      margin-inline-start: auto;
    }
    .nav-logo span { font-weight: 300; color: var(--text-tertiary); }
    .nav-links {
      display: flex;
      gap: 4px;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      transition: all .15s;
    }
    .nav-links a:hover { background: var(--surface-2); color: var(--text-primary); }
    .nav-links a[aria-current="page"] {
      color: var(--primary);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    /* ─── PAGE HEADER ─── */
    .page-header {
      background: var(--surface);
      border-block-end: 1px solid var(--border);
      padding-block: 32px 24px;
    }
    .page-header-inner {
      max-width: 900px;
      margin-inline: auto;
      padding-inline: 24px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -.02em;
      margin-block-end: 6px;
    }
    .page-header-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-block-end: 22px;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-ghost {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all .15s;
    }
    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--surface-3);
    }
    .stats-chips {
      margin-inline-start: auto;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stats-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .stats-chip-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }
    .stats-chip-label {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .stats-sep { width: 1px; height: 28px; background: var(--border); }

    /* ─── MAIN CONTENT ─── */
    .browse-main {
      max-width: 900px;
      margin-inline: auto;
      padding-inline: 24px;
      padding-block: 32px 64px;
    }

    /* ─── DIMENSION ITEM ─── */
    .dimension-list { display: flex; flex-direction: column; gap: 12px; }

    .dim-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s;
    }
    .dim-item.open {
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .dim-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      text-align: start;
      cursor: pointer;
      transition: background .15s;
      background: none;
    }
    .dim-trigger:hover { background: var(--surface-2); }

    .dim-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .dim-info { flex: 1; min-width: 0; }
    .dim-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-block-end: 3px;
    }
    .dim-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .dim-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .dim-count {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--surface-3);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .dim-domains-count {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .dim-chevron {
      font-size: 12px;
      color: var(--text-tertiary);
      transition: transform .25s ease;
      flex-shrink: 0;
      margin-inline-start: 4px;
      user-select: none;
    }
    .dim-item.open .dim-chevron { transform: rotate(180deg); }

    /* ─── DIM BODY ─── */
    .dim-body {
      display: none;
      border-block-start: 1px solid var(--border);
    }
    .dim-item.open .dim-body { display: block; }

    /* ─── DOMAIN LIST ─── */
    .domain-list {
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .domain-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color .15s;
    }
    .domain-item.open { border-color: var(--border-strong); }

    .domain-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      background: var(--surface-2);
      text-align: start;
      cursor: pointer;
      transition: background .15s;
    }
    .domain-trigger:hover { background: var(--surface-3); }

    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .domain-name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .domain-count-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 100px;
      white-space: nowrap;
    }
    .domain-chevron {
      font-size: 11px;
      color: var(--text-tertiary);
      transition: transform .2s;
      margin-inline-start: 4px;
    }
    .domain-item.open .domain-chevron { transform: rotate(180deg); }

    /* ─── DOMAIN BODY ─── */
    .domain-body {
      display: none;
      background: var(--surface);
    }
    .domain-item.open .domain-body { display: block; }

    /* ─── INDICATOR LIST ─── */
    .ind-list { padding: 0; }

    .ind-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px 11px 12px;
      border-block-start: 1px solid var(--border);
      transition: background .12s;
      cursor: pointer;
    }
    .ind-row:hover { background: var(--primary-light); }

    /* Type badges */
    .badge-type {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-type.outcome {
      background: var(--outcome-bg);
      color: var(--outcome-text);
    }
    .badge-type.output {
      background: var(--output-bg);
      color: var(--output-text);
    }
    .badge-type.impact {
      background: var(--impact-bg);
      color: var(--impact-text);
    }
    .badge-type.input {
      background: var(--input-bg);
      color: var(--input-text);
    }

    .ind-name-link {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1.4;
    }
    .ind-row:hover .ind-name-link { color: var(--primary); }

    .ind-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ind-arrow {
      font-size: 13px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: color .12s;
    }
    .ind-row:hover .ind-arrow { color: var(--primary); }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding-block: 80px;
      color: var(--text-tertiary);
      font-size: 15px;
    }
  </style>
</head>

/* ─── RENDER ─── */
function renderDomain(domain) {
  const isOpen = domain.open || false;
  const indHTML = domain.indicators.map(ind => {
    const href = ind.href || 'indicator-card.html';
    return `
      <li class="ind-row" onclick="window.location.href='${href}'">
        <span class="badge-type ${ind.type}">${ind.typeLabel}</span>
        <a href="${href}" class="ind-name-link" onclick="event.stopPropagation()">${ind.name}</a>
        <span class="ind-meta">${ind.meta}</span>
        <span class="ind-arrow">←</span>
      </li>`;
  }).join('');

  return `
    <div class="domain-item${isOpen ? ' open' : ''}" id="${domain.id}">
      <button class="domain-trigger" onclick="toggleDomain('${domain.id}')">
        <span class="domain-dot" style="background:${domain.color}"></span>
        <span class="domain-name">${domain.name}</span>
        <span class="domain-count-pill" style="background:${domain.lightColor};color:${domain.color}">
          ${domain.indicators.length} מדדים
        </span>
        <span class="domain-chevron">▼</span>
      </button>
      <div class="domain-body">
        <ul class="ind-list">${indHTML}</ul>
      </div>
    </div>`;
}

function renderDimension(dim) {
  const totalInds = dim.domains.reduce((s, d) => s + d.indicators.length, 0);
  const isOpen = dim.open || false;
  const domainsHTML = dim.domains.map(renderDomain).join('');

  return `
    <div class="dim-item${isOpen ? ' open' : ''}" id="${dim.id}">
      <button class="dim-trigger" onclick="toggleDim('${dim.id}')">
        <div class="dim-icon" style="background:${dim.color}">${dim.initial}</div>
        <div class="dim-info">
          <div class="dim-name">${dim.name}</div>
          <div class="dim-desc">${dim.desc}</div>
        </div>
        <div class="dim-meta">
          <span class="dim-count">${totalInds} מדדים</span>
          <span class="dim-domains-count">${dim.domains.length} תחומי חיים</span>
        </div>
        <span class="dim-chevron">▼</span>
      </button>
      <div class="dim-body">
        <div class="domain-list">${domainsHTML}</div>
      </div>
    </div>`;
}

function renderTree() {
  const container = document.getElementById('dimension-list');
  container.innerHTML = TREE.map(renderDimension).join('');
}

/* ─── INTERACTIONS ─── */
function toggleDim(id) {
  document.getElementById(id).classList.toggle('open');
}

function toggleDomain(id) {
  document.getElementById(id).classList.toggle('open');
}

function expandAll() {
  document.querySelectorAll('.dim-item').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.domain-item').forEach(el => el.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.dim-item').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.domain-item').forEach(el => el.classList.remove('open'));
}

/* ─── INIT ─── */
renderTree();
</script>

</body>
</html>
